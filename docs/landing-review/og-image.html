<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,700;0,800;1,800&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ————— Les seules lignes que tu as besoin de toucher ————— */
  :root {
    --bg:     #0a0a0a;                    /* fond */
    --ink:    #f5f5f5;                    /* texte principal */
    --accent: #F0FF00;                    /* jaune SIDEKICK */
    --muted:  rgba(245,245,245,0.55);     /* ligne du bas */
  }
  /* ————————————————————————————————————————————————— */

  body {
    width: 1200px; height: 630px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 76px 80px;
    overflow: hidden;
  }

  /* Logo. Si le chemin ne marche pas, supprime le <img> et
     décommente le bloc .wordmark plus bas dans le HTML. */
  .logo { height: 72px; width: auto; display: block;
         align-self: flex-start; object-fit: contain; }
  /* align-self est obligatoire : sans lui, l'image s'étire sur toute la largeur */

  .wordmark {
    font-weight: 800; font-style: italic; font-size: 46px;
    letter-spacing: -0.02em; color: var(--accent);
  }

  h1 {
    font-weight: 800; font-size: 86px; line-height: 1.0;
    letter-spacing: -0.035em; text-transform: uppercase;

  }
  h1 .accent { color: var(--accent); }

  .foot { display: flex; align-items: center; gap: 22px; }
  .rule { width: 56px; height: 4px; background: var(--accent); flex: none; }
  .eyebrow {
    font-weight: 600; font-size: 25px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body>

  <!-- Remplace le chemin par celui de ton logo. -->
  <img class="logo" src="../../public/images/sidekick-logo.png" alt="">
  <!-- Pas de logo sous la main ? Supprime la ligne au-dessus et utilise :
  <div class="wordmark">SIDEKICK</div>
  -->

  <h1>Toute ta carrière.<br><span class="accent">Un seul endroit.</span></h1>

  <div class="foot">
    <div class="rule"></div>
    <div class="eyebrow">Beatmaker · DJ · Musicien · Auteur-compositeur</div>
  </div>

</body>
</html>
